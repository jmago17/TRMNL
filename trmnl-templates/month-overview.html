<!-- TRMNL Private Plugin: Month Overview -->
<!-- Strategy: Webhook | Layout: Full -->

<div style="width:800px;height:480px;font-family:sans-serif;padding:12px;box-sizing:border-box;background:#fff;">
  <div style="font-size:24px;font-weight:bold;text-align:center;margin-bottom:8px;">
    {{ month_title }}
  </div>

  <table style="width:100%;border-collapse:collapse;table-layout:fixed;">
    <thead>
      <tr>
        {% for h in headers %}
          <th style="font-size:13px;padding:3px;text-align:center;border-bottom:2px solid #000;">{{ h }}</th>
        {% endfor %}
      </tr>
    </thead>
    <tbody>
      {% for week in weeks %}
        <tr>
          {% for cell in week %}
            <td style="height:62px;vertical-align:top;padding:3px;border:1px solid #ddd;overflow:hidden;">
              {% if cell.day != blank %}
                <div style="font-size:14px;font-weight:bold;line-height:1;">{{ cell.day }}</div>
                {% for event in cell.events %}
                  <div style="font-size:9px;line-height:1.3;overflow:hidden;white-space:nowrap;color:#222;">{{ event }}</div>
                {% endfor %}
              {% endif %}
            </td>
          {% endfor %}
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
